<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="font"
      href="/fonts/CormorantGaramond.ttf"
      type="font/ttf"
      crossorigin
    />
    <script>
      (() => {
        const pathname = window.location.pathname;
        const background =
          pathname === "/interior"
            ? "/images/interior-background.jpg"
            : pathname === "/landscape"
              ? "/images/landscape-background.jpg"
              : pathname === "/" || pathname === "/about" || pathname === "/contact"
                ? "/images/home-background.jpg"
                : null;

        if (background) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = background;
          document.head.appendChild(preload);
        }
      })();
    </script>
    <meta
      name="description"
      content="刘丁瑜环境设计个人作品集，涵盖室内设计、景观设计、商业空间、居住空间与城市公共环境设计。"
    />
